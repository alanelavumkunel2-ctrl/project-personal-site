<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Background base with soft border -->
  <rect width="400" height="440" rx="28" fill="url(#avatarBg)" />
  <rect x="1" y="1" width="398" height="438" rx="27" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Abstract Tech Grid Patterns in background -->
  <g stroke="#94A3B8" stroke-width="0.75" opacity="0.35">
    <circle cx="200" cy="180" r="160" fill="none" stroke-dasharray="4 6" />
    <circle cx="200" cy="180" r="120" fill="none" />
    <circle cx="200" cy="180" r="80" fill="none" stroke-dasharray="3 3" />
    <line x1="200" y1="20" x2="200" y2="340" />
    <line x1="40" y1="180" x2="360" y2="180" />
  </g>

  <!-- Tech Floating Node Icons -->
  <g transform="translate(60, 60)">
    <rect width="44" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="22" y="28" font-size="20" text-anchor="middle">⚡</text>
  </g>

  <g transform="translate(296, 75)">
    <rect width="44" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="22" y="28" font-size="20" text-anchor="middle">🤖</text>
  </g>

  <g transform="translate(45, 270)">
    <rect width="44" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="22" y="28" font-size="20" text-anchor="middle">💻</text>
  </g>

  <!-- Developer Silhouette / Stylized Portrait -->
  <g transform="translate(100, 100)">
    <!-- Shoulders / Torso -->
    <path d="M 15 260 C 15 200 45 185 100 185 C 155 185 185 200 185 260 Z" fill="url(#shirtGrad)" />
    <!-- Collar / inner shirt -->
    <polygon points="100,185 80,215 120,215" fill="#3B82F6" />
    <polygon points="100,195 88,215 112,215" fill="#FFFFFF" />

    <!-- Neck -->
    <rect x="86" y="145" width="28" height="42" rx="4" fill="#E2B194" />

    <!-- Head / Face -->
    <ellipse cx="100" cy="120" rx="42" ry="50" fill="#F0C3A8" />

    <!-- Stylized Modern Hair -->
    <path d="M 56 115 C 54 75 75 50 100 50 C 125 50 148 70 144 115 C 138 95 125 90 100 90 C 75 90 62 100 56 115 Z" fill="#1E293B" />

    <!-- Minimal Glasses -->
    <rect x="68" y="105" width="26" height="18" rx="4" fill="none" stroke="#0F172A" stroke-width="2.5" />
    <rect x="106" y="105" width="26" height="18" rx="4" fill="none" stroke="#0F172A" stroke-width="2.5" />
    <line x1="94" y1="114" x2="106" y2="114" stroke="#0F172A" stroke-width="2.5" />
    <line x1="58" y1="112" x2="68" y2="112" stroke="#0F172A" stroke-width="2" />
    <line x1="132" y1="112" x2="142" y2="112" stroke="#0F172A" stroke-width="2" />

    <!-- Subtle smile -->
    <path d="M 92 145 Q 100 152 108 145" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Badge: "Student & Maker" -->
  <g transform="translate(100, 375)">
    <rect width="200" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="19" r="4.5" fill="#10B981" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Maker • Developer • Learner</text>
  </g>
</svg>
