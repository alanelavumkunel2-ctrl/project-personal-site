<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow elements -->
  <circle cx="480" cy="120" r="140" fill="#3B82F6" fill-opacity="0.07" filter="url(#accentGlow)" />
  <circle cx="120" cy="380" r="160" fill="#6366F1" fill-opacity="0.05" filter="url(#accentGlow)" />

  <!-- Main Tech Showcase Canvas Card -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="40" width="500" height="420" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Header of IDE / Tech Workbench Card -->
    <rect x="50" y="40" width="500" height="48" rx="24" fill="#F8FAFC" />
    <path d="M 50 88 L 550 88" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Window action dots -->
    <circle cx="78" cy="64" r="5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="96" cy="64" r="5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="114" cy="64" r="5" fill="#10B981" fill-opacity="0.8" />

    <!-- Tab / Status badge -->
    <rect x="150" y="52" width="130" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="162" cy="64" r="3" fill="#10B981" />
    <text x="174" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569">hardware.cpp</text>

    <rect x="290" y="52" width="120" height="24" rx="6" fill="transparent" />
    <text x="300" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">telemetry.js</text>

    <!-- Circuit Board Grid Graphic -->
    <g opacity="0.6">
      <line x1="90" y1="130" x2="230" y2="130" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="230" y1="130" x2="270" y2="170" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="270" y1="170" x2="270" y2="230" stroke="#3B82F6" stroke-width="2" />
      <circle cx="90" cy="130" r="3.5" fill="#3B82F6" />
      <circle cx="270" cy="230" r="3.5" fill="#3B82F6" />

      <line x1="510" y1="150" x2="430" y2="150" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="430" y1="150" x2="380" y2="200" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="510" cy="150" r="3.5" fill="#10B981" />
    </g>

    <!-- Centerpiece: High-Tech Microcontroller & Robotics Node -->
    <g transform="translate(190, 160)">
      <!-- Board base plate -->
      <rect x="0" y="0" width="220" height="170" rx="16" fill="url(#chipGrad)" stroke="#334155" stroke-width="2" />
      
      <!-- MCU Chip center -->
      <rect x="55" y="45" width="110" height="80" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="1.5" />
      <text x="110" y="85" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">ESP32 / MCU</text>
      <text x="110" y="103" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="9" font-weight="500" fill="#38BDF8" text-anchor="middle">240MHz • DUAL CORE</text>

      <!-- Pin connectors Left & Right -->
      <g fill="#94A3B8">
        <rect x="-6" y="20" width="8" height="6" rx="1.5" />
        <rect x="-6" y="35" width="8" height="6" rx="1.5" />
        <rect x="-6" y="50" width="8" height="6" rx="1.5" fill="#3B82F6" />
        <rect x="-6" y="65" width="8" height="6" rx="1.5" />
        <rect x="-6" y="80" width="8" height="6" rx="1.5" />
        <rect x="-6" y="95" width="8" height="6" rx="1.5" />
        <rect x="-6" y="110" width="8" height="6" rx="1.5" fill="#10B981" />
        <rect x="-6" y="125" width="8" height="6" rx="1.5" />
        <rect x="-6" y="140" width="8" height="6" rx="1.5" />

        <rect x="218" y="20" width="8" height="6" rx="1.5" />
        <rect x="218" y="35" width="8" height="6" rx="1.5" fill="#3B82F6" />
        <rect x="218" y="50" width="8" height="6" rx="1.5" />
        <rect x="218" y="65" width="8" height="6" rx="1.5" fill="#F59E0B" />
        <rect x="218" y="80" width="8" height="6" rx="1.5" />
        <rect x="218" y="95" width="8" height="6" rx="1.5" />
        <rect x="218" y="110" width="8" height="6" rx="1.5" />
        <rect x="218" y="125" width="8" height="6" rx="1.5" />
        <rect x="218" y="140" width="8" height="6" rx="1.5" />
      </g>

      <!-- Wi-Fi / Radio Antenna trace -->
      <path d="M 85 18 L 95 18 L 95 30 L 105 30 L 105 18 L 115 18 L 115 30 L 125 30 L 125 18 L 135 18" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
      
      <!-- Power & status LEDs -->
      <circle cx="25" cy="25" r="3" fill="#10B981" />
      <circle cx="35" cy="25" r="3" fill="#3B82F6" />
      <text x="45" y="28" font-family="monospace" font-size="8" fill="#64748B">TX/RX</text>
    </g>

    <!-- Code & Telemetry Terminal card overlay -->
    <g transform="translate(80, 310)">
      <rect x="0" y="0" width="220" height="110" rx="12" fill="#0F172A" />
      <circle cx="16" cy="16" r="3.5" fill="#EF4444" />
      <circle cx="28" cy="16" r="3.5" fill="#F59E0B" />
      <circle cx="40" cy="16" r="3.5" fill="#10B981" />
      
      <text x="16" y="44" font-family="monospace" font-size="10.5" fill="#94A3B8">&gt; connect(LoRa_Transceiver);</text>
      <text x="16" y="62" font-family="monospace" font-size="10.5" fill="#10B981">&gt; status: 200 OK [Synced]</text>
      <text x="16" y="80" font-family="monospace" font-size="10.5" fill="#38BDF8">&gt; ultrasonic.ping() =&gt; 42.6cm</text>
      <text x="16" y="98" font-family="monospace" font-size="10.5" fill="#FBBF24">&gt; telemetry: live stream</text>
    </g>

    <!-- Interactive Signal / Live Wave Monitor -->
    <g transform="translate(330, 335)">
      <rect x="0" y="0" width="190" height="85" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">SENSOR TELEMETRY</text>
      <circle cx="170" cy="20" r="4" fill="#10B981" />
      
      <!-- Wave path -->
      <path d="M 16 60 Q 35 30 55 55 T 95 55 T 135 45 T 170 55" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- LoRa Wireless Waves -->
    <g stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.8">
      <path d="M 400 130 A 20 20 0 0 1 425 155" />
      <path d="M 400 115 A 40 40 0 0 1 445 155" />
      <path d="M 400 100 A 60 60 0 0 1 465 155" />
    </g>
  </g>
</svg>
