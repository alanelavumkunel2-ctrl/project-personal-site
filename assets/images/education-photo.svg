<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#eduBg)" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Academic / Maker Lab Illustration -->
  <g transform="translate(100, 50)">
    <!-- Desk / Table surface -->
    <rect x="0" y="160" width="300" height="8" rx="3" fill="#CBD5E1"/>

    <!-- Open notebook / textbook -->
    <path d="M 50 160 L 95 140 L 140 160 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="95" y1="140" x2="95" y2="160" stroke="#3B82F6" stroke-width="1.5"/>

    <!-- Laptop with code / AI window -->
    <rect x="160" y="100" width="90" height="60" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <rect x="165" y="105" width="80" height="48" rx="3" fill="#0F172A"/>
    <circle cx="172" cy="112" r="2" fill="#EF4444"/>
    <circle cx="178" cy="112" r="2" fill="#F59E0B"/>
    <circle cx="184" cy="112" r="2" fill="#10B981"/>
    <line x1="172" y1="122" x2="210" y2="122" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="172" y1="130" x2="230" y2="130" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="172" y1="138" x2="200" y2="138" stroke="#10B981" stroke-width="1.5"/>
    <rect x="150" y="160" width="110" height="4" rx="2" fill="#64748B"/>

    <!-- Electronics breadboard & microcontroller -->
    <rect x="10" y="145" width="35" height="15" rx="3" fill="#0284C7"/>
    <circle cx="16" cy="150" r="1.5" fill="#FFFFFF"/>
    <circle cx="22" cy="150" r="1.5" fill="#FFFFFF"/>
    <circle cx="28" cy="150" r="1.5" fill="#FFFFFF"/>
    <circle cx="34" cy="150" r="1.5" fill="#FFFFFF"/>
    <path d="M 28 145 Q 35 125 45 145" fill="none" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- Graduation Cap / Learning Icon float -->
    <g transform="translate(115, 20)">
      <polygon points="35,0 0,15 35,30 70,15" fill="#1E293B"/>
      <polygon points="18,18 18,34 35,42 52,34 52,18 35,26" fill="#2563EB"/>
      <path d="M 68 15 L 68 35" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="68" cy="37" r="3" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Tag badge -->
  <g transform="translate(130, 245)">
    <rect width="240" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="4" fill="#10B981"/>
    <text x="32" y="22" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Grade 10 • Kasaragod, Kerala</text>
  </g>
</svg>
