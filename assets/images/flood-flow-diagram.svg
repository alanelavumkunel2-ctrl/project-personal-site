<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Step 1: Sensing -->
  <g transform="translate(30, 45)" filter="url(#softShadow)">
    <rect width="140" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#EFF6FF"/>
    <text x="28" y="36" font-size="18" text-anchor="middle">📡</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">SENSING NODE</text>
    <text x="14" y="92" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">Ultrasonic (Water)</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">Raindrop Sensor</text>
    <rect x="14" y="122" width="70" height="16" rx="4" fill="#E2E8F0"/>
    <text x="49" y="133" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#475569" text-anchor="middle">INPUT</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="#2563EB" stroke-width="2.5" fill="none">
    <line x1="175" y1="120" x2="200" y2="120"/>
    <polygon points="204,120 196,115 196,125" fill="#2563EB"/>
  </g>

  <!-- Step 2: Transmitter MCU -->
  <g transform="translate(210, 45)" filter="url(#softShadow)">
    <rect width="140" height="150" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#EFF6FF"/>
    <text x="28" y="36" font-size="18" text-anchor="middle">⚡</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">TRANSMITTER</text>
    <text x="14" y="92" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">ESP32 MCU</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">Data Filtering</text>
    <rect x="14" y="122" width="70" height="16" rx="4" fill="#DBEAFE"/>
    <text x="49" y="133" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">PROCESS</text>
  </g>

  <!-- Arrow 2 (Wireless LoRa) -->
  <g transform="translate(355, 95)">
    <path d="M 5 25 Q 22 5 40 25" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 12 25 Q 22 13 32 25" fill="none" stroke="#2563EB" stroke-width="2"/>
    <text x="22" y="42" font-family="monospace" font-size="9.5" font-weight="700" fill="#2563EB" text-anchor="middle">LoRa 433MHz</text>
  </g>

  <!-- Step 3: Wireless LoRa Link -->
  <g transform="translate(405, 45)" filter="url(#softShadow)">
    <rect width="140" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#EFF6FF"/>
    <text x="28" y="36" font-size="18" text-anchor="middle">📶</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">WIRELESS LINK</text>
    <text x="14" y="92" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">AS32 LoRa Mod</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">Point-to-Point</text>
    <rect x="14" y="122" width="70" height="16" rx="4" fill="#E2E8F0"/>
    <text x="49" y="133" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#475569" text-anchor="middle">TELEMETRY</text>
  </g>

  <!-- Arrow 3 -->
  <g stroke="#2563EB" stroke-width="2.5" fill="none">
    <line x1="550" y1="120" x2="575" y2="120"/>
    <polygon points="579,120 571,115 571,125" fill="#2563EB"/>
  </g>

  <!-- Step 4: Receiver MCU -->
  <g transform="translate(585, 45)" filter="url(#softShadow)">
    <rect width="140" height="150" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#EFF6FF"/>
    <text x="28" y="36" font-size="18" text-anchor="middle">💻</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">RECEIVER BASE</text>
    <text x="14" y="92" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">ESP32 Base MCU</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">Packet Decoding</text>
    <rect x="14" y="122" width="70" height="16" rx="4" fill="#DBEAFE"/>
    <text x="49" y="133" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">EVALUATE</text>
  </g>

  <!-- Arrow 4 -->
  <g stroke="#2563EB" stroke-width="2.5" fill="none">
    <line x1="730" y1="120" x2="755" y2="120"/>
    <polygon points="759,120 751,115 751,125" fill="#2563EB"/>
  </g>

  <!-- Step 5: Alerts & Display -->
  <g transform="translate(765, 45)" filter="url(#softShadow)">
    <rect width="115" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="12" y="14" width="32" height="32" rx="8" fill="#ECFDF5"/>
    <text x="28" y="36" font-size="18" text-anchor="middle">🚨</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">WARNING</text>
    <text x="14" y="92" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">2.8" TFT Display</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="10.5" fill="#475569">Traffic LEDs & Buzzer</text>
    <rect x="14" y="122" width="70" height="16" rx="4" fill="#D1FAE5"/>
    <text x="49" y="133" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#065F46" text-anchor="middle">ALERT</text>
  </g>
</svg>
