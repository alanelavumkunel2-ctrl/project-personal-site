<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="circBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#circBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Technical Schematic Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Schematic traces -->
  <g stroke="#38BDF8" stroke-width="2" fill="none">
    <path d="M 80 180 L 160 180 L 160 120 L 240 120"/>
    <circle cx="80" cy="180" r="4" fill="#38BDF8"/>
    <circle cx="240" cy="120" r="4" fill="#38BDF8"/>
    <path d="M 360 120 L 440 120 L 440 220 L 520 220"/>
    <circle cx="360" cy="120" r="4" fill="#10B981"/>
    <circle cx="520" cy="220" r="4" fill="#10B981"/>
  </g>

  <!-- Central Schematic Module Box -->
  <rect x="220" y="80" width="160" height="150" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="300" y="115" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">CIRCUIT DIAGRAM</text>
  <text x="300" y="135" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">SCHEMATIC PLACEHOLDER</text>
  <text x="300" y="170" font-family="monospace" font-size="10" fill="#38BDF8" text-anchor="middle">[ Click to Enlarge / View ]</text>
  <rect x="245" y="190" width="110" height="24" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="300" y="206" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Replace with Diagram</text>
</svg>
