<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="robotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="arduinoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00979D" />
      <stop offset="100%" stop-color="#006468" />
    </linearGradient>
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <rect width="500" height="320" fill="url(#robotBg)" />

  <!-- Grid ground plane / perspective -->
  <g stroke="#374151" stroke-width="0.8" opacity="0.35">
    <line x1="50" y1="280" x2="450" y2="280" />
    <line x1="20" y1="305" x2="480" y2="305" />
    <line x1="100" y1="250" x2="400" y2="250" />
    <line x1="160" y1="230" x2="60" y2="320" />
    <line x1="340" y1="230" x2="440" y2="320" />
  </g>

  <!-- Bluetooth Signal Emission Waves from smartphone/controller -->
  <g stroke="#3B82F6" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 120 70 A 18 18 0 0 1 140 90" />
    <path d="M 110 60 A 32 32 0 0 1 150 100" />
    <path d="M 100 50 A 46 46 0 0 1 160 110" />
  </g>

  <!-- Remote Controller / Phone icon -->
  <g transform="translate(45, 60)">
    <rect x="0" y="0" width="46" height="80" rx="8" fill="#1F2937" stroke="#3B82F6" stroke-width="1.5" />
    <rect x="5" y="10" width="36" height="52" rx="4" fill="#0B132B" />
    <circle cx="23" cy="71" r="3" fill="#6B7280" />
    <!-- D-pad on screen -->
    <polygon points="23,18 20,24 26,24" fill="#3B82F6" />
    <polygon points="23,38 20,32 26,32" fill="#3B82F6" />
    <polygon points="13,28 19,25 19,31" fill="#3B82F6" />
    <polygon points="33,28 27,25 27,31" fill="#3B82F6" />
    <text x="23" y="55" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="700" fill="#10B981" text-anchor="middle">PAIRED</text>
  </g>

  <!-- Bluetooth Arrow trajectory to Car -->
  <path d="M 160 100 Q 210 110 235 145" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="235" cy="145" r="3" fill="#3B82F6" />

  <!-- ROBOTIC CAR ASSEMBLY -->
  <!-- Shadow under chassis -->
  <ellipse cx="320" cy="275" rx="140" ry="24" fill="#030712" opacity="0.6" />

  <!-- Wheels Left & Right (Isometric/Angle View) -->
  <!-- Rear Left Wheel -->
  <rect x="200" y="195" width="26" height="55" rx="6" fill="url(#tireGrad)" stroke="#4B5563" stroke-width="1.5" />
  <rect x="206" y="205" width="14" height="35" rx="4" fill="#F59E0B" />
  <!-- Front Left Wheel -->
  <rect x="380" y="195" width="26" height="55" rx="6" fill="url(#tireGrad)" stroke="#4B5563" stroke-width="1.5" />
  <rect x="386" y="205" width="14" height="35" rx="4" fill="#F59E0B" />

  <!-- Acrylic Chassis Plate -->
  <rect x="210" y="180" width="190" height="70" rx="14" fill="url(#chassisGrad)" stroke="#4B5563" stroke-width="2" />
  <rect x="214" y="184" width="182" height="62" rx="10" fill="#111827" opacity="0.4" />

  <!-- Front caster wheel / bumper -->
  <rect x="390" y="215" width="25" height="18" rx="4" fill="#94A3B8" />

  <!-- L298N Motor Driver Module -->
  <g transform="translate(230, 160)">
    <rect x="0" y="0" width="45" height="38" rx="5" fill="#DC2626" stroke="#EF4444" stroke-width="1" />
    <!-- Heat sink fins -->
    <rect x="12" y="5" width="22" height="15" fill="#1E293B" />
    <line x1="16" y1="5" x2="16" y2="20" stroke="#94A3B8" stroke-width="1" />
    <line x1="20" y1="5" x2="20" y2="20" stroke="#94A3B8" stroke-width="1" />
    <line x1="24" y1="5" x2="24" y2="20" stroke="#94A3B8" stroke-width="1" />
    <line x1="28" y1="5" x2="28" y2="20" stroke="#94A3B8" stroke-width="1" />
    <text x="22" y="32" font-family="monospace" font-size="6.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">L298N</text>
  </g>

  <!-- Arduino Uno Board -->
  <g transform="translate(290, 145)">
    <rect x="0" y="0" width="80" height="55" rx="6" fill="url(#arduinoBlue)" stroke="#00C4CC" stroke-width="1.5" />
    <!-- ATmega chip -->
    <rect x="22" y="18" width="40" height="18" rx="2" fill="#1F2937" stroke="#374151" stroke-width="0.8" />
    <text x="42" y="30" font-family="monospace" font-size="7" font-weight="700" fill="#E5E7EB" text-anchor="middle">ATmega328P</text>
    <rect x="5" y="8" width="14" height="12" fill="#CBD5E1" rx="1" /> <!-- USB connector -->
    <circle cx="12" cy="38" r="4" fill="#111827" /> <!-- Power jack -->
    <text x="42" y="47" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">ARDUINO UNO</text>
  </g>

  <!-- HC-05 Bluetooth Module -->
  <g transform="translate(378, 140)">
    <rect x="0" y="0" width="24" height="42" rx="3" fill="#1E40AF" stroke="#60A5FA" stroke-width="1" />
    <circle cx="12" cy="8" r="2.5" fill="#EF4444" />
    <circle cx="12" cy="16" r="2.5" fill="#3B82F6" />
    <text x="12" y="30" font-family="monospace" font-size="6" font-weight="700" fill="#FFFFFF" text-anchor="middle">HC-05</text>
  </g>

  <!-- Front Wheels (Forefront layer) -->
  <rect x="235" y="235" width="28" height="60" rx="6" fill="url(#tireGrad)" stroke="#4B5563" stroke-width="1.5" />
  <rect x="242" y="246" width="14" height="38" rx="4" fill="#F59E0B" />

  <rect x="350" y="235" width="28" height="60" rx="6" fill="url(#tireGrad)" stroke="#4B5563" stroke-width="1.5" />
  <rect x="357" y="246" width="14" height="38" rx="4" fill="#F59E0B" />

  <!-- Info Tag -->
  <g transform="translate(320, 45)">
    <rect x="0" y="0" width="145" height="52" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1.2" />
    <text x="12" y="20" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#9CA3AF">WIRELESS CONTROL</text>
    <text x="12" y="38" font-family="monospace" font-size="11" fill="#60A5FA">PWM Drive: 2.4 GHz</text>
  </g>
</svg>
